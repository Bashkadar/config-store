---
name: Lint and Test Playbook

"on":
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  validate:
    name: Run Linters and Ansible Lint
    runs-on: ubuntu-latest

    steps:
      # Шаг 1: Скачиваем код репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # Шаг 2: Проверка YAML (yamllint)
      - name: Run yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .

      # Шаг 3: Настраиваем Python (необходим для работы ansible-lint@v6)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Шаг 4: Автоматический поиск и проверка ВСЕХ плейбуков
      - name: Run Ansible Lint
        uses: ansible/ansible-lint@v26
        with:
          # устанавливаем коллекции из файла requirements.yml
          setup_collections: true
          targets: playbooks/

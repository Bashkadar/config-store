---
- name: Аудит безопасности пользователей и групп (Hardening Check)
  hosts: myhosts
  become: true
  gather_facts: false

  tasks:
    - name: 1. ПРОВЕРКА: Поиск пользователей с пустым паролем
      ansible.builtin.shell: |
        set -o pipefail
        awk -F: '($2 == "" || $2 == "!") {print $1}' /etc/shadow
      executable: /bin/bash
      register: empty_passwords
      changed_when: false

    - name: КРИТИЧЕСКАЯ ОШИБКА: Обнаружены пользователи без пароля!
      ansible.builtin.fail:
        msg: "Внимание! Найдены пользователи без установленного пароля: {{ empty_passwords.stdout_lines }}"
      when: empty_passwords.stdout_lines | length > 0

    - name: 2. ПРОВЕРКА: Поиск сторонних пользователей с UID 0 (Duplicate Root)
      ansible.builtin.shell: |
        set -o pipefail
        awk -F: '($3 == 0 && $1 != "root") {print $1}' /etc/passwd
      executable: /bin/bash
      register: duplicate_uid_zero
      changed_when: false

    - name: КРИТИЧЕСКАЯ ОШИБКА: Обнаружены сторонние пользователи с UID 0!
      ansible.builtin.fail:
        msg: "Внимание! Обнаружены пользователи с правами root (UID 0): {{ duplicate_uid_zero.stdout_lines }}"
      when: duplicate_uid_zero.stdout_lines | length > 0

    - name: 3. ПРОВЕРКА: Поиск устаревших/слабых алгоритмов хеширования паролей
      ansible.builtin.shell: |
        set -o pipefail
        # Ищет хеши, не начинающиеся с $6$ (SHA-512) или $y$ (Yescrypt) у реальных пользователей
        awk -F: '$2 ~ /^\$[^6y]/ {print $1}' /etc/shadow
      executable: /bin/bash
      register: weak_hashes
      changed_when: false

    - name: ПРЕДУПРЕЖДЕНИЕ: Использование слабых алгоритмов хеширования
      ansible.builtin.debug:
        msg: "Рекомендуется обновить хеши паролей (используется старый алгоритм) для: {{ weak_hashes.stdout_lines }}"
      when: weak_hashes.stdout_lines | length > 0

    - name: 4. ПРОВЕРКА: Аудит политик устаревания паролей (/etc/login.defs)
      ansible.builtin.shell: |
        set -o pipefail
        grep -E '^PASS_MAX_DAYS' /etc/login.defs | awk '{print $2}'
      executable: /bin/bash
      register: pass_max_days
      changed_when: false

    - name: ПРЕДУПРЕЖДЕНИЕ: Слишком долгий срок действия пароля по умолчанию
      ansible.builtin.debug:
        msg: "Максимальный срок действия пароля составляет {{ pass_max_days.stdout }}. Рекомендуется установить значение не более 90 или 180 дней."
      when: (pass_max_days.stdout | int > 180 or 
            pass_max_days.stdout | int == 99999)

    - name: Итог проверки
      ansible.builtin.debug:
        msg: "Базовый аудит пользователей и групп успешно пройден. Критических уязвимостей не обнаружено."

---
- name: Настройка UFW
  hosts: all
  become: true
  tasks:

    - name: Установка UFW (если не установлен)
      ansible.builtin.package:
        name: ufw
        state: present

    - name: Установка политики по умолчанию (запретить входящие)
      community.general.ufw:
        policy: deny
        direction: incoming

    - name: Установка политики по умолчанию (разрешить исходящие)
      community.general.ufw:
        policy: allow
        direction: outgoing

    - name: Разрешить трафик для SSH
      community.general.ufw:
        rule: allow
        name: OpenSSH

    - name: Разрешить трафик для HTTP
      community.general.ufw:
        rule: allow
        port: '80'
        proto: tcp

    - name: Разрешить трафик для HTTPS
      community.general.ufw:
        rule: allow
        port: '443'
        proto: tcp

    - name: Включить UFW и применить правила
      community.general.ufw:
        state: enabled

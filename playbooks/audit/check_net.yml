---
- name: Аудит сетевой безопасности и открытых портов
  hosts: myhosts
  become: true
  gather_facts: true

  vars:
    # Список разрешенных портов
    allowed_ports:
      - 22    # SSH
      - 80    # HTTP
      - 443   # HTTPS

  tasks:
    - name: "1. Статус брандмауэра (UFW / Firewalld)"
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          if command -v ufw >/dev/null 2>&1; then
              ufw status |
              grep -q "Status: active" && echo "ufw_active"
              || echo "ufw_inactive"
          elif command -v firewall-cmd >/dev/null 2>&1; then
              firewall-cmd --state >/dev/null 2>&1 && echo "firewalld_active"
              || echo "firewalld_inactive"
          else
              echo "no_firewall"
          fi
      register: firewall_status
      changed_when: false

    - name: КРИТИЧЕСКАЯ ОШИБКА - брандмауэр отключен или не установлен!
      ansible.builtin.fail:
        msg: >
          Внимание! На сервере не активен ни один брандмауэр.
          Текущий статус: {{ firewall_status.stdout }}
      when: >
        firewall_status.stdout in
        ['ufw_inactive', 'firewalld_inactive', 'no_firewall']

    - name: "2. Сбор всех открытых портов (слушающих TCP/UDP)"
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          ss -tuln | awk 'NR>1 {print $4}' | awk -F: '{print $NF}' | sort -nu
        executable: /bin/bash
      register: listening_ports_raw
      changed_when: false

    - name: Фильтрация и поиск несанкционированных портов
      ansible.builtin.set_fact:
        unauthorized_ports: ({{ listening_ports_raw.stdout_lines
                            | map('int')
                            | difference(allowed_ports) }})

    - name: ПРЕДУПРЕЖДЕНИЕ - обнаружены лишние открытые порты
      ansible.builtin.debug:
        msg: >
          Внимание! На сервере обнаружены слушающие порты,
          которые не внесены в белый список: {{ unauthorized_ports }}
      when: unauthorized_ports | length > 0

    - name: Итог проверки сети
      ansible.builtin.debug:
        msg: >
          Сетевой аудит успешно пройден.
          Все брандмауэры активны, сторонние порты не обнаружены.
      when: unauthorized_ports | length == 0
